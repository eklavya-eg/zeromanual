[project]
name = "browseragent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.13.11",
    "fastapi>=0.162.0",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
