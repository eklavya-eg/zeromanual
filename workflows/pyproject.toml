[project]
name = "workflows"
version = "0.1.0"
description = "Scheduled browser crawls that publish Eye job application tasks"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "celery[redis]>=5.5.3",
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[project.scripts]
crawl-naukri = "workflows.crawl_naukri:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workflows*"]

[tool.pytest.ini_options]
pythonpath = ["."]
