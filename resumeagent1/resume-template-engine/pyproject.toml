[project]
name = "resume-template-engine"
version = "0.1.0"
description = "JSON-to-PDF renderer for a fixed, ATS-friendly A4 resume template"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "jinja2>=3.1",
  "playwright>=1.42",
]

[project.scripts]
resume-render = "resume_engine:main"
