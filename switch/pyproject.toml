[project]
name = "switch"
version = "0.1.0"
description = "Scheduled multi-agent workflow service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openai>=3.42.1",
    "prisma>=0.15.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "redis>=7.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
